version: 1
active:
  - name: librarian
    alias: Olivier
    description: Research and catalog agent. Searches the owner's vault (locally, via `rg`) and optionally the web, and returns structured reports of sources for the orchestrator. Also reviews or creates frontmatter (`description`, `tags`) on owner-territory files per project conventions. Never talks to the owner directly.
    file: .claude/agents/librarian.md
    status: active
    hired_at: "2026-04-22"
    version: "1.0.0"
  - name: scheduler
    alias: Cal
    description: Cold data-layer agent. Aggregates tasks, events, and completed work from channels declared in `.claude/agents/data/channels.yaml` (memories.db always; others the owner wires up — task tools, calendars, CRMs) to answer prospective ("what do I need to do") and retrospective ("what did I do") questions. Returns structured, sourced lists to the orchestrator. Never talks to the owner directly, never writes.
    file: .claude/agents/scheduler.md
    status: active
    hired_at: "2026-04-22"
    version: "1.0.0"
  - name: steward
    alias: Della
    description: Backlog steward. Weekly review of the open task rows in memories.db and the live tasks on the warm channel declared in preferences; proposes reasoned closures, groupings under a parent idea, true duplicates, and moves to the right store, judged against the task creation thresholds. Proposes without executing, every write stays with the orchestrator. Never talks to the owner directly.
    file: .claude/agents/steward.md
    status: active
    hired_at: "2026-09-24"
    version: "1.0.0"
retired: []
